services:
    postgres:
        image: postgres:16
        container_name: boom-pg
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASS}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:
